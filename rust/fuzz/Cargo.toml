[package]
name = "baselineops-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
baselineops-domain = { version = "=3.0.0-alpha.1", path = "../crates/baselineops-domain" }
baselineops-windows = { version = "=3.0.0-alpha.1", path = "../crates/baselineops-windows" }
libfuzzer-sys = "=0.4.13"
tempfile = "=3.23.0"

[[bin]]
name = "profile_json"
path = "fuzz_targets/profile_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan_json"
path = "fuzz_targets/plan_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "safe_path"
path = "fuzz_targets/safe_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive"
path = "fuzz_targets/archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_output"
path = "fuzz_targets/native_output.rs"
test = false
doc = false
bench = false
