# Groups merged pull requests into reader-oriented sections for GitHub's
# generated release notes; packaging itself remains in the release workflow.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security and hardening
      labels:
        - security
    - title: New capabilities
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - '*'
