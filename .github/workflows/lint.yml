name: Lint (shell/yaml/markdown/actions)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'fix/**'
      - 'feat/**'
      - 'update-*'
      - 'update/**'
    paths-ignore:
      - 'private/**'
  pull_request:
    branches:
      - main
      - dev
      - 'fix/**'
      - 'feat/**'
    paths-ignore:
      - 'private/**'

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shell/yaml/markdown/actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Repository lint smoke
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci-local.sh
          git diff --check -- .
