name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]{0,126}$ ]]; then
            printf 'Invalid release tag: %s\n' "${tag}" >&2
            exit 1
          fi
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"
          asset="win-mdm-security-hardening-kit-${tag}.zip"
          printf 'asset=%s\n' "${asset}" >> "${GITHUB_OUTPUT}"

      - name: Build package
        env:
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive \
            --format=zip \
            --output="dist/${RELEASE_ASSET}" \
            HEAD \
            README.md CHANGELOG.md CONTRIBUTING.md LICENSE SECURITY.md PSScriptAnalyzerSettings.psd1 \
            docs examples lib scripts tools
          sha256sum "dist/${RELEASE_ASSET}" > "dist/${RELEASE_ASSET}.sha256"

      - name: Attest package provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/${{ steps.release.outputs.asset }}

      - name: Download attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation download \
            "dist/${RELEASE_ASSET}" \
            --repo "${GITHUB_REPOSITORY}" \
            --format jsonl \
            > "dist/${RELEASE_ASSET}.intoto.jsonl"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload \
            "${RELEASE_TAG}" \
            "dist/${RELEASE_ASSET}" \
            "dist/${RELEASE_ASSET}.sha256" \
            "dist/${RELEASE_ASSET}.intoto.jsonl" \
            --clobber
