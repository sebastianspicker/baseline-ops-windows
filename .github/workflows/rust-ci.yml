# Verifies the portable and Windows-specific contracts for the additive Rust v3 workspace.
name: Rust v3 CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
    paths:
      - 'rust/**'
      - 'tools/quality/**'
      - 'tests/RustV3Oracle*.ps1'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'tools/quality/**'
      - 'tests/RustV3Oracle*.ps1'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/rust-ci.yml'

permissions: {}

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable contracts and tooling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt

      - name: Cache Rust compilation
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}

      - name: Cache quality analyzer dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .cache/quality
          key: quality-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust/rust-toolchain.toml', 'tools/quality/tool-versions.psd1', 'tools/quality/requirements-lizard.txt', 'tools/quality/jscpd/package-lock.json') }}

      - name: Verify Rust v3 code quality
        shell: pwsh
        run: ./tools/quality/Test-CodeQuality.ps1 -ReleaseLine Rust

      - name: Verify workspace
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --all-features
          cargo run -p xtask -- verify

      - name: Cache pinned cargo-deny
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-0.20.2-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}

      - name: Verify dependency advisories, licenses, bans, and sources
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi
          test "$(cargo deny --version)" = "cargo-deny 0.20.2"
          cargo deny check

  windows-x64:
    name: Windows x64 compile and contract tests
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc

      - name: Cache Rust compilation
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}

      - name: Cache quality analyzer dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .cache/quality
          key: quality-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust/rust-toolchain.toml', 'tools/quality/tool-versions.psd1', 'tools/quality/requirements-lizard.txt', 'tools/quality/jscpd/package-lock.json') }}

      - name: Verify Rust v3 code quality
        shell: pwsh
        run: ./tools/quality/Test-CodeQuality.ps1 -ReleaseLine Rust

      - name: Build and test Windows boundary
        working-directory: rust
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings
          cargo test --workspace --all-features --target x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc `
            -p baselineops-cli -p baselineops-gui -p baselineops-worker
