# Runs the pinned cross-platform PowerShell verification contract used to decide
# whether a change is safe to merge into the alpha release line.
name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'fix/**'
      - 'feat/**'
      - 'update-*'
      - 'update/**'
  pull_request:
    branches:
      - main
      - dev
      - 'fix/**'
      - 'feat/**'

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # SHA-256 values are published with the official PowerShell v7.6.3 release.
  POWERSHELL_VERSION: '7.6.3'
  POWERSHELL_LINUX_X64_SHA256: '856d0765d2332377f9d7a4aea76efdfde4de51446e7738dde2dfda41dba9e2a7'
  POWERSHELL_WINDOWS_X64_SHA256: '07ddb0d00b660459560ef82a9841da7705b27cd5dcca5a0d7b025a98eca29eca'
  PSSCRIPTANALYZER_VERSION: '1.25.0'

jobs:
  verify:
    name: ${{ matrix.check_name }}
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_id: core-7.6.3
            check_name: Static checks
            edition: Core
          - runtime_id: windows-powershell-5.1
            check_name: Static checks (Windows PowerShell 5.1)
            edition: Desktop
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache PowerShell modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~\Documents\WindowsPowerShell\Modules
            ~\Documents\PowerShell\Modules
          key: psmodules-${{ runner.os }}-${{ matrix.runtime_id }}-psscriptanalyzer-${{ env.PSSCRIPTANALYZER_VERSION }}

      - name: Install checksum-pinned PowerShell 7.6.3
        if: matrix.edition == 'Core'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $asset = "PowerShell-$env:POWERSHELL_VERSION-win-x64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $installRoot = Join-Path $env:RUNNER_TEMP "powershell-$env:POWERSHELL_VERSION"
          $uri = "https://github.com/PowerShell/PowerShell/releases/download/v$env:POWERSHELL_VERSION/$asset"
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $env:POWERSHELL_WINDOWS_X64_SHA256) {
            throw "PowerShell archive hash mismatch. Expected $env:POWERSHELL_WINDOWS_X64_SHA256, got $actualHash."
          }
          if (Test-Path -LiteralPath $installRoot) {
            Remove-Item -LiteralPath $installRoot -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot
          $executable = Join-Path $installRoot 'pwsh.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "PowerShell executable was not extracted: $executable"
          }
          "POWERSHELL_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $installRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Select Windows PowerShell 5.1
        if: matrix.edition == 'Desktop'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = Join-Path $PSHOME 'powershell.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Windows PowerShell executable was not found: $executable"
          }
          "POWERSHELL_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify selected PowerShell runtime
        env:
          EXPECTED_EDITION: ${{ matrix.edition }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identityJson = & $env:POWERSHELL_EXE -NoLogo -NoProfile -Command @'
          [pscustomobject]@{
            Version = $PSVersionTable.PSVersion.ToString()
            Major = $PSVersionTable.PSVersion.Major
            Minor = $PSVersionTable.PSVersion.Minor
            Edition = $PSVersionTable.PSEdition
          } | ConvertTo-Json -Compress
          '@
          if ($LASTEXITCODE -ne 0) { throw 'The selected PowerShell runtime could not be queried.' }
          $identity = $identityJson | ConvertFrom-Json
          if ($identity.Edition -cne $env:EXPECTED_EDITION) {
            throw "Expected PowerShell edition $env:EXPECTED_EDITION, got $($identity.Edition)."
          }
          if ($env:EXPECTED_EDITION -eq 'Core' -and $identity.Version -cne $env:POWERSHELL_VERSION) {
            throw "Expected PowerShell $env:POWERSHELL_VERSION exactly, got $($identity.Version)."
          }
          if ($env:EXPECTED_EDITION -eq 'Desktop' -and
              ($identity.Major -ne 5 -or $identity.Minor -ne 1)) {
            throw "Expected Windows PowerShell 5.1, got $($identity.Version)."
          }
          "Using $($identity.Edition) $($identity.Version) at $env:POWERSHELL_EXE"

      - name: Ensure PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @'
          $ErrorActionPreference = 'Stop'
          $version = $env:PSSCRIPTANALYZER_VERSION
          $installed = Get-Module -ListAvailable -Name PSScriptAnalyzer |
            Where-Object Version -eq $version |
            Select-Object -First 1
          if ($null -eq $installed) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name PSScriptAnalyzer -RequiredVersion $version -Scope CurrentUser -Force
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $version -Force
          $loadedVersion = (Get-Module -Name PSScriptAnalyzer).Version.ToString()
          if ($loadedVersion -cne $version) {
            throw "Expected PSScriptAnalyzer $version, loaded $loadedVersion."
          }
          '@
          & $env:POWERSHELL_EXE -NoLogo -NoProfile -Command $setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Secret scan (basic)
        shell: powershell
        run: |
          & $env:POWERSHELL_EXE -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\secret-scan.ps1 -RootPath $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Static checks
        shell: powershell
        run: |
          $verification = @'
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force
          & (Join-Path $env:GITHUB_WORKSPACE 'tools/verify.ps1') -RootPath $env:GITHUB_WORKSPACE
          exit $LASTEXITCODE
          '@
          & $env:POWERSHELL_EXE -NoLogo -NoProfile -ExecutionPolicy Bypass -Command $verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  portable-gate-linux:
    # Runs the same portable gate contributors run locally (dev/ci-local.sh):
    # secret scan, documentation, parse, PSScriptAnalyzer, complexity and
    # and duplication on the pinned PowerShell runtime.
    name: Portable gate (Linux, PowerShell 7.6.3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: verify
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install checksum-pinned PowerShell 7.6.3
        uses: ./.github/actions/setup-pinned-pwsh-linux
        with:
          version: ${{ env.POWERSHELL_VERSION }}
          linux-x64-sha256: ${{ env.POWERSHELL_LINUX_X64_SHA256 }}

      - name: Cache quality analyzer dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .cache/quality
          key: quality-${{ runner.os }}-${{ runner.arch }}-powershell-${{ hashFiles('dev/quality/tool-versions.psd1', 'dev/quality/requirements-lizard.txt', 'dev/quality/jscpd/package-lock.json') }}

      - name: Portable gate
        shell: bash
        run: bash ./dev/ci-local.sh
