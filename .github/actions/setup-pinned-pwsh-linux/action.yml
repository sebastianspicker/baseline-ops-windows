# Installs an exact checksum-verified PowerShell runtime for Linux CI jobs.
name: Setup pinned PowerShell for Linux
description: Download, verify, and expose a checksum-pinned Linux x64 PowerShell runtime.

inputs:
  version:
    description: Exact PowerShell version to install.
    required: true
  linux-x64-sha256:
    description: SHA-256 digest for the PowerShell Linux x64 archive.
    required: true

runs:
  using: composite
  steps:
    - name: Install checksum-pinned PowerShell
      shell: bash
      env:
        POWERSHELL_VERSION: ${{ inputs.version }}
        POWERSHELL_LINUX_X64_SHA256: ${{ inputs['linux-x64-sha256'] }}
      run: |
        set -euo pipefail
        asset="powershell-${POWERSHELL_VERSION}-linux-x64.tar.gz"
        archive="${RUNNER_TEMP}/${asset}"
        install_root="${RUNNER_TEMP}/powershell-${POWERSHELL_VERSION}"
        curl --fail --show-error --location --retry 3 \
          --proto '=https' --proto-redir '=https' \
          --output "${archive}" \
          "https://github.com/PowerShell/PowerShell/releases/download/v${POWERSHELL_VERSION}/${asset}"
        printf '%s  %s\n' "${POWERSHELL_LINUX_X64_SHA256}" "${archive}" | sha256sum -c -
        rm -rf "${install_root}"
        mkdir -p "${install_root}"
        tar -xzf "${archive}" -C "${install_root}"
        chmod 0755 "${install_root}/pwsh"
        actual_version="$("${install_root}/pwsh" -NoLogo -NoProfile -Command "\$PSVersionTable.PSVersion.ToString()")"
        if [[ "${actual_version}" != "${POWERSHELL_VERSION}" ]]; then
          printf 'Expected PowerShell %s exactly, got %s.\n' "${POWERSHELL_VERSION}" "${actual_version}" >&2
          exit 1
        fi
        printf '%s\n' "${install_root}" >> "${GITHUB_PATH}"
        printf 'POWERSHELL_EXE=%s/pwsh\n' "${install_root}" >> "${GITHUB_ENV}"
        printf 'PWSH_BIN=%s/pwsh\n' "${install_root}" >> "${GITHUB_ENV}"
